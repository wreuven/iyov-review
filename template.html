<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספר איוב · הכנה למבחן</title>
<meta name="description" content="ספר איוב בשאלות ותשובות, לפי דפי העבודה של המורה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --paper:#fffdf8; --ink:#27221d; --muted:#6d6459; --line:#e6ddcf;
  --accent:#2f4858; --accent-soft:#e3eaee; --gold:#a8742a; --gold-soft:#f7ecd9;
  --teacher:#7a3b5c; --teacher-soft:#f4e6ee; --ok:#3d7a4f; --ok-soft:#e2f0e5; --warn:#b4532a; --warn-soft:#f8e6dc;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 18px rgba(60,40,20,.05);
  --serif:"Frank Ruhl Libre","David","Times New Roman",serif;
  --sans:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --paper:#211f1c; --ink:#ece5da; --muted:#a59b8e; --line:#36322c;
    --accent:#9fc0d3; --accent-soft:#25313a; --gold:#e0b26a; --gold-soft:#332818;
    --teacher:#e3a3c4; --teacher-soft:#36232e; --ok:#86c79a; --ok-soft:#1f3326; --warn:#f0a07a; --warn-soft:#3a251b;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --paper:#211f1c; --ink:#ece5da; --muted:#a59b8e; --line:#36322c;
  --accent:#9fc0d3; --accent-soft:#25313a; --gold:#e0b26a; --gold-soft:#332818;
  --teacher:#e3a3c4; --teacher-soft:#36232e; --ok:#86c79a; --ok-soft:#1f3326; --warn:#f0a07a; --warn-soft:#3a251b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%}
strong{font-weight:700}
button{font:inherit;color:inherit}

.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.progress{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.pbar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden;max-width:240px}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.pcount{font-size:.85rem;color:var(--muted);white-space:nowrap}
.iconbtn{font-size:.88rem;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.only-mobile{display:none}

.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;padding:0 16px}
aside.side{position:sticky;top:62px;align-self:start;max-height:calc(100vh - 76px);overflow:auto;padding:22px 0 30px}
main{min-width:0;max-width:760px;padding-bottom:90px}

.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);border-inline-start:3px solid transparent}
.toc a:hover{background:var(--accent-soft)}
.toc a.current{background:var(--accent-soft);border-inline-start-color:var(--accent)}
.tch{grid-column:1/3;font-size:.75rem;font-weight:800;color:var(--gold)}
.tt{grid-column:1/3;font-weight:700;line-height:1.3}
.tc{grid-row:1/3;grid-column:3;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
.tc.full{color:var(--ok);font-weight:800}

.hero{padding:40px 0 6px}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.5rem,7vw,4rem);line-height:1.05;margin:.1em 0 .25em}
.hero p{margin:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}

.part{margin-top:48px}
.part-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.chips{font-size:.8rem;font-weight:800;color:var(--gold)}
.part-head h2{font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1.15;margin:0}
.intro{background:var(--paper);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow)}
.intro p{margin:.35em 0}

.qs{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.qcard.known{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.qcard.again{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.qtext{display:flex;gap:12px;font-weight:700;line-height:1.55}
.qn{font-family:var(--serif);font-weight:900;color:var(--accent);min-width:1.3em;font-size:1.1rem;line-height:1.4}
.qcard.known .qn::after{content:" ✓";color:var(--ok)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;background:var(--teacher-soft);color:var(--teacher);border-radius:6px;padding:0 7px;margin-inline-end:8px;vertical-align:2px}
.reveal{margin:10px 0 0;margin-inline-start:calc(1.3em + 12px);cursor:pointer;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:transparent;color:var(--accent);font-weight:700;font-size:.88rem;border-radius:8px;padding:3px 14px}
.reveal:hover{background:var(--accent-soft)}
.ans{margin-top:10px;margin-inline-start:calc(1.3em + 12px)}
.atext{background:var(--bg);border-radius:10px;padding:10px 14px;border-inline-start:3px solid var(--ok)}
.mark{display:flex;gap:8px;margin-top:8px}
.mark button{cursor:pointer;font-size:.82rem;font-weight:700;border-radius:20px;padding:2px 12px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.qcard.known .knew{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qcard.again .again{background:var(--warn-soft);color:var(--warn);border-color:transparent}
body.show-all .reveal{display:none}
body.hide-known .qcard.known{display:none}

.quiz{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:16px}
.qz{display:flex;flex-direction:column;gap:6px;text-align:right;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.qz-v{font-family:var(--serif);font-size:1.15rem;font-weight:700;line-height:1.45}
.qz-a{font-size:.9rem;color:var(--muted);visibility:hidden}
.qz.open{border-color:var(--accent)}
.qz.open .qz-a{visibility:visible}
.qz.open .qz-a strong{color:var(--accent)}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding:30px 0 50px}

@media (max-width:900px){
  body{font-size:17px}
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  aside.side{position:fixed;top:0;inset-inline-start:0;width:min(84vw,320px);max-height:none;height:100%;background:var(--paper);z-index:60;padding:20px 14px;box-shadow:0 0 40px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .25s}
  body.toc-open aside.side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;display:none}
  body.toc-open .scrim{display:block}
  .only-mobile{display:inline-block}
  .pbar{display:none}
  .qcard{padding:12px 14px}
  .reveal,.ans{margin-inline-start:0}
  .part-head h2{font-size:1.6rem}
}
@media print{
  .topbar,aside.side,.tools,.reveal,.mark,.scrim{display:none!important}
  .layout{display:block} .ans{display:block!important} .qz-a{visibility:visible}
  body{background:#fff;font-size:12pt} .qcard,.intro{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <button class="iconbtn only-mobile" id="tocBtn" type="button">☰ חלקים</button>
  <a class="brand" href="#top">ספר איוב</a>
  <div class="progress"><div class="pbar"><i id="pfill"></i></div><span class="pcount" id="pcount">0/{{TOTAL}} ידעתי</span></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="החלפת מצב בהיר/כהה" title="בהיר/כהה"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></div>
<div class="scrim" id="scrim"></div>

<div class="layout" id="top">
<aside class="side" aria-label="חלקים">
<ol class="toc">
{{TOC}}
</ol>
</aside>
<main>
  <header class="hero">
    <div class="eyebrow">{{SUBTITLE}}</div>
    <h1>{{TITLE}}</h1>
    <p>{{LEAD}}</p>
    <div class="tools">
      <button class="iconbtn" id="showAll" type="button" aria-pressed="false">מצב קריאה: כל התשובות פתוחות</button>
      <button class="iconbtn" id="hideKnown" type="button" aria-pressed="false">להסתיר מה שידעתי</button>
      <button class="iconbtn" id="resetBtn" type="button">איפוס סימונים</button>
    </div>
  </header>
{{BODY}}
  <footer>התשובות לשאלות האישיות הן כיוונים אפשריים, לא תשובה אחת נכונה.</footer>
</main>
</div>

<script>
(function(){
  var KEY='iyov2:';
  function get(k,d){try{var v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
  function set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}
  var root=document.documentElement, body=document.body;

  var theme=get('theme',null); if(theme) root.setAttribute('data-theme',theme);
  document.getElementById('themeBtn').onclick=function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var n=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',n); set('theme',n);
  };

  var marks=get('marks',{});
  var cards=[].slice.call(document.querySelectorAll('.qcard'));
  function paint(){
    var known=0, per={};
    cards.forEach(function(c){
      var id=c.dataset.q, m=marks[id], part=c.closest('.part').dataset.part;
      c.classList.toggle('known',m==='k'); c.classList.toggle('again',m==='a');
      per[part]=per[part]||[0,0]; per[part][1]++;
      if(m==='k'){known++; per[part][0]++;}
    });
    document.getElementById('pcount').textContent=known+'/'+cards.length+' ידעתי';
    document.getElementById('pfill').style.width=(100*known/cards.length)+'%';
    document.querySelectorAll('[data-count]').forEach(function(el){
      var c=per[el.dataset.count]||[0,0]; el.textContent=c[0]+'/'+c[1]; el.classList.toggle('full',c[1]&&c[0]===c[1]);
    });
  }
  cards.forEach(function(c){
    var ans=c.querySelector('.ans');
    c.querySelector('.reveal').onclick=function(){ans.hidden=false;this.hidden=true;};
    c.querySelector('.knew').onclick=function(){marks[c.dataset.q]=marks[c.dataset.q]==='k'?undefined:'k';set('marks',marks);paint();};
    c.querySelector('.again').onclick=function(){marks[c.dataset.q]=marks[c.dataset.q]==='a'?undefined:'a';set('marks',marks);paint();};
  });
  paint();

  function toggle(btn,cls,key){
    var on=get(key,false);
    function apply(){btn.setAttribute('aria-pressed',on);body.classList.toggle(cls,on);
      if(cls==='show-all') cards.forEach(function(c){c.querySelector('.ans').hidden=!on && !c.querySelector('.reveal').hidden;});}
    btn.onclick=function(){on=!on;set(key,on);apply();};
    apply();
  }
  toggle(document.getElementById('showAll'),'show-all','showAll');
  toggle(document.getElementById('hideKnown'),'hide-known','hideKnown');
  document.getElementById('resetBtn').onclick=function(){ if(confirm('לאפס את כל הסימונים?')){marks={};set('marks',marks);paint();} };

  document.querySelectorAll('.qz').forEach(function(b){b.onclick=function(){b.classList.toggle('open');};});

  function closeToc(){body.classList.remove('toc-open');}
  document.getElementById('tocBtn').onclick=function(){body.classList.toggle('toc-open');};
  document.getElementById('scrim').onclick=closeToc;
  document.querySelectorAll('.toc a').forEach(function(a){a.addEventListener('click',closeToc);});

  var links={}; document.querySelectorAll('[data-toc]').forEach(function(a){links[a.dataset.toc]=a;});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){Object.keys(links).forEach(function(k){links[k].classList.remove('current');});
        var l=links[e.target.id]; if(l) l.classList.add('current');}
    });},{rootMargin:'-30% 0px -60% 0px'});
    document.querySelectorAll('section.part').forEach(function(s){io.observe(s);});
  }
  window.addEventListener('beforeprint',function(){cards.forEach(function(c){c.querySelector('.ans').hidden=false;});});
})();
</script>
</body>
</html>
